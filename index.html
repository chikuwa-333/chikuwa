<a id="link" href="https://ja.wikipedia.org/wiki/%E3%81%A1%E3%81%8F%E3%82%8F">竹輪</a>

<script>
  const words = [ "竹輪の穴を覗く時、竹輪の穴もまた、こちらを覗いている。吸い込まれないように注意せよ。さもなければ、明日の味噌汁の具材は、あなたになってしまうでしょう。" ];

  const box = document.getElementById("words");
  for (const w of words) {
    const el = document.createElement("div");
    el.className = "word";
    el.textContent = w;
    box.appendChild(el);
  }
</script>
